apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: n3-rafael
  labels: { app: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: loja-api:1.0
          imagePullPolicy: IfNotPresent   # usa a imagem local do Docker Desktop
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: api-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-secret, key: MYSQL_ROOT_PASSWORD }
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: n3-rafael
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
