# Gerador de carga para o HPA (fora de k8s/ de proposito)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga
  namespace: n3-rafael
spec:
  replicas: 3
  selector:
    matchLabels: { app: carga }
  template:
    metadata:
      labels: { app: carga }
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O- http://api:3000/produtos >/dev/null; done"]
